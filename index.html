<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e5">
  <meta name="description" content="2026 台灣創價學會總會｜邁向創立100週年・躍躍前進之年">
  <title>2026 三重區·地區友好總會邀請函</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-intro">
  <div class="backdrop" data-asset-bg="bg_sky.webp" aria-hidden="true"></div>

  <main id="app" class="frame">
    <!-- ① 信封開場 -->
    <section id="envelope-screen" class="screen envelope-screen" aria-label="邀請函開場">
      <div class="paper-texture" aria-hidden="true"></div>
      <div class="ambient" aria-hidden="true"></div>

      <div class="logo-slot corner" data-asset="soka_logo.svg">
        <span class="logo-placeholder">台灣創價學會</span>
      </div>
      <header class="env-header">
        <p class="env-eyebrow">2026 三重區·地區友好總會<span class="eyebrow-sub">邀請函</span></p>
      </header>

      <div class="envelope-wrap">
        <div class="envelope" id="envelope">
          <div class="env-inner"></div>
          <div class="letter" aria-hidden="true">
            <span class="letter-line"></span><span class="letter-line short"></span>
          </div>
          <div class="letter-glow" aria-hidden="true"></div>
          <div class="env-base" data-asset-bg="envelope_base.webp" aria-hidden="true">
            <svg viewBox="0 0 420 296" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="envSide" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#eadcc2"/>
                </linearGradient>
                <linearGradient id="envBottom" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stop-color="#f6ecd9"/><stop offset="1" stop-color="#e2d0ae"/>
                </linearGradient>
              </defs>
              <path d="M0 0 L210 168 L0 296Z" fill="url(#envSide)"/>
              <path d="M420 0 L210 168 L420 296Z" fill="url(#envSide)"/>
              <path d="M0 296 L210 150 L420 296Z" fill="url(#envBottom)"/>
              <path d="M0 296 L210 150 L420 296" fill="none" stroke="#cdb489" stroke-width="1.2"/>
              <path d="M18 278 L210 166 L402 278" fill="none" stroke="#b58a42" stroke-width=".8" stroke-dasharray="2 5" opacity=".6"/>
            </svg>
          </div>
          <div class="env-flap" data-asset-bg="envelope_flap.png" aria-hidden="true">
            <svg viewBox="0 0 420 176" preserveAspectRatio="none">
              <defs>
                <linearGradient id="flapG" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#ecdfc6"/>
                </linearGradient>
              </defs>
              <path d="M0 0 H420 L222 168 Q210 178 198 168 Z" fill="url(#flapG)"/>
              <path d="M0 0 L198 168 Q210 178 222 168 L420 0" fill="none" stroke="#cdb489" stroke-width="1.2"/>
            </svg>
          </div>
          <button id="wax-seal" class="wax-seal" data-asset="wax_seal.png" aria-label="點擊封蠟，開啟邀請函">
            <svg viewBox="0 0 100 100" aria-hidden="true" class="seal-svg">
              <defs>
                <radialGradient id="waxG" cx=".36" cy=".32" r=".75">
                  <stop offset="0" stop-color="#d67a5c"/><stop offset=".55" stop-color="#9c3a2c"/><stop offset="1" stop-color="#6e2219"/>
                </radialGradient>
                <linearGradient id="sealGold" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#fbe6a8"/><stop offset=".5" stop-color="#d7ad5b"/><stop offset="1" stop-color="#a77a30"/>
                </linearGradient>
              </defs>
              <path d="M50 3 C61 4 66 9 75 11 C86 15 92 25 95 36 C98 46 96 55 97 63 C95 76 87 87 75 92 C65 97 56 96 47 97 C35 96 24 92 15 84 C6 75 3 63 4 51 C3 40 5 28 13 18 C22 8 37 2 50 3Z" fill="url(#waxG)"/>
              <circle cx="50" cy="50" r="33" fill="none" stroke="#6e2219" stroke-width="2.4" opacity=".55"/>
              <circle cx="50" cy="50" r="31" fill="none" stroke="url(#sealGold)" stroke-width="1.4"/>
              <g fill="url(#sealGold)" transform="translate(50 50)">
                <path id="petal" d="M0 -22 C6 -14 6 -7 0 -3 C-6 -7 -6 -14 0 -22Z"/>
                <use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/>
                <use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(180)"/>
                <use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/>
                <use href="#petal" transform="rotate(315)"/>
                <circle r="4.2"/>
              </g>
            </svg>
            <span class="seal-pulse" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <p class="open-hint" id="open-hint"><span class="hint-dot" aria-hidden="true"></span>輕觸封蠟・開啟邀請</p>
      <button id="skip-intro" class="skip-button" type="button">跳過動畫</button>
    </section>

    <!-- ② 五幕歷史回顧 ＋ 100 主視覺 -->
    <section id="cinema-screen" class="screen cinema-screen" aria-label="歷史回顧動畫" hidden>
      <div id="scene-stage" class="scene-stage" aria-hidden="true"></div>
      <div class="paper-texture film-grain" aria-hidden="true"></div>
      <ol class="sr-only" aria-label="五幕畫面說明">
        <li>第一幕：師弟相遇，戰後簡樸室內，兩人對坐交談，窗邊暖光照入。</li>
        <li>第二幕：師弟共戰，桌燈下兩人並肩整理稿件與書籍。</li>
        <li>第三幕：信念傳承，青年們專注聆聽，畫面漸轉暖金。</li>
        <li>第四幕：廣布拓展，不同年齡與背景的人們交流相聚。</li>
        <li>第五幕：希望延續，不同世代一同朝向晨曦前進。</li>
      </ol>
      <div id="anniversary" class="anniversary" data-asset-bg="bg_sunrise.webp" aria-hidden="true">
        <div class="ann-rays"></div>
        <div class="ann-glow" data-asset-bg="light_rays.png"></div>
        <div class="ann-petals" data-asset-bg="petals.png"></div>
        <canvas id="particle-canvas" class="particle-canvas"></canvas>
        <div class="ann-number" id="ann-number" data-asset="number_100.png">100</div>
        <div class="ann-theme">
          <span class="ann-line" id="ann-line-1">邁向創立100週年</span>
          <span class="ann-line" id="ann-line-2">躍躍前進之年</span>
        </div>
      </div>
      <div id="ribbon-sweep" class="ribbon-sweep" aria-hidden="true">
        <svg viewBox="0 0 600 200" preserveAspectRatio="none">
          <defs>
            <linearGradient id="ribG" x1="0" x2="1">
              <stop offset="0" stop-color="#b58a42" stop-opacity="0"/>
              <stop offset=".3" stop-color="#e9c77c"/><stop offset=".6" stop-color="#8fc4e8"/>
              <stop offset="1" stop-color="#f3b9b0" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M-20 140 C140 40 300 190 460 80 S620 60 640 70" fill="none" stroke="url(#ribG)" stroke-width="26" stroke-linecap="round"/>
          <path d="M-20 160 C160 80 300 200 470 110 S620 90 640 96" fill="none" stroke="#fff6dc" stroke-width="4" stroke-linecap="round" opacity=".8"/>
        </svg>
      </div>
      <div id="flash" class="flash" data-asset-bg="letter_inner.webp" aria-hidden="true"></div>
      <button id="skip-cinema" class="skip-button" type="button">跳過動畫</button>
    </section>

    <!-- ③ 資訊頁 -->
    <section id="info-screen" class="info-screen" aria-labelledby="event-theme" hidden>
      <header class="info-hero">
        <svg class="hero-ribbon" viewBox="0 0 600 220" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="heroRib" x1="0" x2="1">
              <stop offset="0" stop-color="#e9c77c" stop-opacity="0"/>
              <stop offset=".35" stop-color="#e9c77c"/><stop offset=".7" stop-color="#8fc4e8"/>
              <stop offset="1" stop-color="#f3b9b0" stop-opacity=".2"/>
            </linearGradient>
          </defs>
          <path d="M-20 170 C140 70 300 210 460 100 S620 70 640 80" fill="none" stroke="url(#heroRib)" stroke-width="18" stroke-linecap="round" opacity=".75"/>
          <path d="M-20 188 C160 110 300 220 470 128 S620 104 640 110" fill="none" stroke="#b58a42" stroke-width="1.4" opacity=".6"/>
        </svg>
        <div class="logo-slot corner" data-asset="soka_logo.svg">
          <span class="logo-placeholder">台灣創價學會</span>
        </div>
        <p class="eyebrow" id="event-title"></p>
        <div class="hero-100" data-asset="number_100.png" aria-hidden="true">100</div>
        <h1 id="event-theme" tabindex="-1"></h1>
      </header>

      <section class="block welcome" aria-label="邀請詞">
        <svg class="welcome-orn" viewBox="0 0 150 22" aria-hidden="true"><path d="M2 11 H58 M92 11 H148" stroke="currentColor" stroke-width="1" opacity=".7"/><path d="M75 3 C80 8 80 14 75 19 C70 14 70 8 75 3Z" fill="currentColor"/><path d="M75 11 C68 6 62 6 58 11 C62 16 68 16 75 11Z M75 11 C82 6 88 6 92 11 C88 16 82 16 75 11Z" fill="currentColor" opacity=".55"/><circle cx="52" cy="11" r="1.6" fill="currentColor"/><circle cx="98" cy="11" r="1.6" fill="currentColor"/></svg>
        <p id="welcome-copy" class="welcome-copy"></p>
        <svg class="welcome-orn bottom" viewBox="0 0 150 22" aria-hidden="true"><path d="M2 11 H58 M92 11 H148" stroke="currentColor" stroke-width="1" opacity=".7"/><path d="M75 3 C80 8 80 14 75 19 C70 14 70 8 75 3Z" fill="currentColor"/><path d="M75 11 C68 6 62 6 58 11 C62 16 68 16 75 11Z M75 11 C82 6 88 6 92 11 C88 16 82 16 75 11Z" fill="currentColor" opacity=".55"/><circle cx="52" cy="11" r="1.6" fill="currentColor"/><circle cx="98" cy="11" r="1.6" fill="currentColor"/></svg>
      </section>

      <section class="block sessions" aria-labelledby="sessions-h">
        <h2 id="sessions-h"><span class="h-rule" aria-hidden="true"></span>各地區場次<span class="h-rule" aria-hidden="true"></span></h2>
        <ol id="session-list" class="session-list"></ol>
      </section>

      <section class="block venue" aria-labelledby="venue-h">
        <h2 id="venue-h"><span class="h-rule" aria-hidden="true"></span>活動地點<span class="h-rule" aria-hidden="true"></span></h2>
        <div class="venue-card">
          <div class="venue-text">
            <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2Z" fill="currentColor"/></svg>
            <div>
              <p id="venue-name" class="venue-name"></p>
              <p id="venue-address" class="venue-address"></p>
            </div>
          </div>
          <div id="map-embed" class="map-embed" hidden></div>
          <a id="map-link" class="btn btn-primary" href="#" target="_blank" rel="noopener">在 Google 地圖開啟導航</a>
        </div>
      </section>

      <footer class="info-footer">
        <button id="replay" class="btn btn-ghost" type="button">重播開場動畫</button>
        <p class="foot-note">台灣創價學會</p>
      </footer>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="event-data.js"></script>
  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
